spring.application.name=studio

# --- Database (filled in automatically once you add MySQL on Railway) ---
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --- Mail (contact form) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=arfath12356@gmail.com
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

studio.contact.inbox=mdarfathahmed4@gmail.com

# --- Railway assigns this dynamically ---
server.port=${PORT:8080}