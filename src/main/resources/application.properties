spring.application.name=studio

# --- Database (Aiven MySQL) ---
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&requireSSL=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --- Mail (contact form) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=arfath12356@gmail.com
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

studio.contact.inbox=mdarfathahmed4@gmail.com

# --- Render assigns this dynamically, same idea as Railway's PORT ---
server.port=${PORT:8080}